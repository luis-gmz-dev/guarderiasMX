name: Directorio

on:
  schedule:
    # Lunes a las 8:00, hora de México (UTC-6). No corre al hacer push, así que su propio commit no la vuelve a disparar.
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: directorio
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/actualizar-directorio.ts
      - name: Publicar solo si el Excel cambió
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Sin cambios. No hay despliegue."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/datos/guarderias.json
          git commit -m "Actualiza el directorio de guarderías del IMSS."
          git push
